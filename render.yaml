services:
  - type: web
    name: tennis-league-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEFAULT_MARKET_NAME
        value: Accra
      - key: DEFAULT_MARKET_TIMEZONE
        value: Africa/Accra
      - key: DEFAULT_MARKET_CURRENCY
        value: GHS
      - key: PAYSTACK_SECRET_KEY
        value: sk_test_paystack_placeholder
      - key: PAYSTACK_PUBLIC_KEY
        value: pk_test_paystack_placeholder
      - key: STRIPE_SECRET_KEY
        value: sk_test_placeholder
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_placeholder
      - key: STRIPE_PUBLISHABLE_KEY
        value: pk_test_placeholder
      - key: EMAIL_PROVIDER
        value: console
      - key: LOG_LEVEL
        value: info
